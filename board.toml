# OnePlus Pad 2 Pro (erhai / OPD2413, SM8750P) — UniXNU device repository.
#
# Ported from UniXNU/UniXNU-sheng (Xiaomi Pad 6S Pro, SM8550) — the only board
# that has been reported to reach an iPadOS home screen. Everything that is
# identity or Apple-side plumbing is copied from sheng on purpose: both boards
# boot the *same unchanged* iPad7,1 / iPadOS 17.7.11 (21H461) restore image, so
# the platform expert has to believe it is an iPad Pro (12.9-inch) 2nd gen.
#
# Hardware values measured on this unit (adb, /proc/iomem, /proc/meminfo):
#   FD base/size  0xA7000000 / 0x2A8000   (stock uefi_a ELF PT_LOAD)
#   splash_region 0xFC800000 + 0x2B00000  (live DT /reserved-memory/splash_region)
#   GICD          0x16000000 + 0x10000    /proc/iomem "GICD"
#   GICR          0x16080000 + 0x200000   /proc/iomem "GICR", stride 0x40000
#   APSS_HM       0x16000000 + 0x02000000 MemoryMapLib "APSS_HM"
#   timebase      19.2 MHz                CNTFRQ_EL0
#   DRAM base     0x80000000              /proc/iomem gunyah_hyp
#   panel         3392x2400  qcom,mdss_dsi_panel_XN242_P_D_A0024_vid
#   touch         novatek,nf_nt36536
#   UFS           0x1d84000              1d84000.ufshc
#
# The target image is an iPad7,1 restore: 6.36 GiB IPSW, 44 MiB kernelcache.

[board]
name = "erhai"
soc = "SM8750"
description = "OnePlus Pad 2 Pro OPD2413: iPad7,1 userland bring-up"
kit = "erhai"

# The target OS image: the unchanged iPad7,1 iPadOS 17.7.11 restore.
# sha256 of the extracted kernelcache is pinned in [kernel.prelink]; the
# extracted members are cached under out/ipsw/21H461/.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# The raw image for the userdata partition: the OS and SystemOS disk images of the IPSW behind a manifest.
# first_lba and last_lba are the GPT entry "userdata" of LUN 0 (sda15), read by NativeUfs on this unit
# (2026-10-23, probe 10) and matching the 237,866,397,696-byte partition of the backup.
[userdata]
first_lba = 0x3798e8
last_lba = 0x3adb7fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "erhai_defconfig"
# The prelink (below) is what makes the payload kernel carry Apple's own kexts,
# so source_only must stay false: export_source() refuses to run alongside
# [kernel.prelink], and a source-only kernel has __PRELINK_TEXT size 0 and no
# Apple drivers at all — it can reach the platform expert and nothing further.
source_only = false
# Ordering follows UniXNU-sheng/board.toml. build-boot-progress.py is what puts
# the S1..S6 screen checkpoints in; without it CONFIG_XNU_BOOT_PROGRESS=y is a
# no-op and a silent hang looks identical to "the kernel never started".
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-platform.py",
  "build-boot-progress.py",
  "build-libpthread-kernel.py",
  # UFS root, after sheng's list. NativeUfs is the erhai copy (drivers/NativeUfs);
  # NativeVirtioBlock and its bindings provide the original IOBlockStorageDevice
  # base its block device derives from. The verified bundles named by the
  # defconfig are built outside this list (they need the owner key).
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-arm-driver.py NativeUfs",
  "build-arm-driver.py NativeVirtioBlock",
  "build-native-virtio-bindings.py --component NativeVirtioBlock",
  # Vendored from UniXNU-sheng (drivers/ShengPlatformPower here).
  "build-sheng-platform-power.py",
]

# The prelink is what makes the payload kernel carry Apple's own kexts.
#
# AppleMobileFileIntegrity asks the policy manager for every decision and panics
# with "AMFI: No PMGR" (ConfigurationSettings.cpp:235) when no PMGR has published
# its nub. The early bring-up therefore left AMFI and PMGR out (as dada, Xiaomi 15
# SM8750, does). Userspace needs AMFI, so the UFS-root build follows sheng:
# ShengPlatformPower (sheng-pmgr=2) publishes the original ApplePMGR nub, and
# AMFI, PMGR and sandbox are back in the set with AMFI's early security init.
# Still left out (GPU / display / input, not needed to reach launchd):
#   com.apple.iokit.IOGPUFamily, com.apple.iokit.IOMobileGraphicsFamily,
#   com.apple.iokit.IOHIDFamily, com.apple.iokit.IOHIDEventDriver
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
# The original AppleMobileFileIntegrity initializer, run before MAC lockdown. The
# address is in the original kernelcache pinned above, so sheng's value holds.
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]

[payload]
volume = "ERHAIESP"
# A prelinked source kernel is ~67 MiB, and the ADT adds ~11 KiB. 192 MiB is the
# next power-of-two-ish step that leaves room for a Data seed later, and still
# sits inside the decompressed region this board's ABL has been booting from.
# The packer reports the exact requirement if this ever becomes too small.
size_mib = 192
loader = "firmware"
title = "OnePlus Pad 2 Pro: iPad7,1 bring-up"
# sheng records 0x80000000 as the SMEM RAM-table value on SM8550 hardware and
# the iPad7,1 kernelcache is qualified against it. Our 0x2E0000000 was the
# Android-visible total, not the window DarwinBoot hands over, and passing a
# figure the kernelcache never saw only invites a disagreeing memory map.
dram_size = "0x80000000"
# The original static + System trust caches, bundled unchanged by build-original-system-trust.py; the payload step only
# accepts a --trust-cache with this hash (same as sheng: same IPSW).
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
]
timeout = 10
# Patch the panic path so a panic paints the screen instead of disappearing?
# payload.py shells out to <tree>/scripts/patch-xnu-entry-probe.py, which does
# NOT exist in the upstream tree this board builds from — it lives in
# UniXNU-sheng's own scripts/. Enabling this makes the payload step fail with
# "No such file or directory" after the whole kernel has been built. Kept off
# until that script is vendored into the device patch.
# Consequence: a panic on this board prints to a serial port nothing is
# listening to, and the screen simply stops. S1..S6 / boot-progress is the
# substitute, and it works without any patching.
panic_screen = false
# sheng's own list, minus the flags consumed by patches that exist only in that
# repository (offline-legacy-*, offline-hid-*, offline-mobile-graphics-*).
# Kept because they are read by code the two boards share: boot-progress=2 turns
# on the screen checkpoints build-boot-progress.py compiles in, and
# armcpu-diagnostics / armcpu-spi-ipi make ArmCpu report the GIC and IPI state.
#
# Three values are taken from IssacL04/UniXNU-Pagani_SM8750 (OnePlus 13T, same
# SM8750), which already reaches the root-device wait on this SoC:
#
#   serial=0  sheng's serial=3 selects a kprintf serial backend this board has
#       no UART for. On hardware (2026-10-23, run-1 payload) the kernel passed
#       S1..S6 and then panicked in kprintf setup with "pmap_map_bd
#       @pmap.c:1931" (no PTE for the early I/O mapping); pagani boots with 0.
#
#   kt_fixed_zones=240  sheng's 120 is below what a source XNU needs. The type
#       allocator asserts n_zones_sig + n_zones_type + 1 <= 32 (kalloc.c:1779);
#       pagani measured 33 slots needed at the default 260-zone budget and 30 at
#       240, and the assert fired on the device at the smaller value. Nothing in
#       the erhai build changes that distribution, so 120 is a guaranteed panic.
#
#   cpus=1  bring-up runs on the boot CPU only. SMP needs the secondary-core
#       entry path, per-core stacks and GIC redistributor bring-up, none of which
#       this port has exercised yet; pagani keeps the same limit. The ADT still
#       publishes one CPU for the same reason (cpu_regs = "0" below).
kernel_args = [
  "-v",
  "serial=0",
  "debug=0x14e",
  "kt_fixed_zones=240",
  "boot-progress=2",
  "cpus=1",
  "armcpu-diagnostics=1",
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  # Lets the xnu build print through early boot instead of buffering into a
  # zone that does not exist yet — the cheapest way to see where a hang is.
  "-enable_kprintf_spam",
  # UFS bring-up step, one boot per level (drivers/NativeUfs start()); each
  # panics with its report and writes nothing.
  #   2 (2026-10-23): GDSCs on, UFS clocks running, UFSHCI 4.0, 32 slots,
  #     64-bit DMA, HCS=0x10f, HCE=1: the controller and link are left up.
  #   10: adopt the controller, SMMU bypass, LUN 0 GPT -> userdata -> block 0.
  #     First run: SMMU window 0xd0000 too small (erhai DT: 0x100000), fixed.
  #     Second run: SMMU bypass OK, the first command (NOP OUT) failed.
  #     Third run (diagnostics): timeout, DB stays 1, IS=0, OCS untouched, no
  #     SMMU fault; DMA buffer at 0x8c806a000 (high DRAM).
  #   4: TEST UNIT READY through the firmware's own list memory (0xd652a000),
  #     to tell DMA reachability of high DRAM from a transport problem.
  #     Result: same stall (DB=1, IS=0), so not the address.
  #     With the SMMU left as handed over (native-ufs-smmu=0): the tablet reset
  #     itself on the first command, so an unmatched UFS stream is fatal here.
  #   15 (erhai): read-only dump of every SMMU stream mapping and the top banks: only one
  #     valid entry (SID 0x800 -> bank 3); the UFS stream 0x60 is not visible to us.
  #   Next: probe 10 with an identity-mapped stage-1 context (native-ufs-smmu=2).
  #   smmu=2 (identity stage 1, TCR2.SEP fixed): NOP OUT stalls again, no fault visible.
  #   smmu=3: same tables with the DMA's GiB invalid, to see whether the walker can read them.
  #     -> level-1 translation fault at the request list as expected: the walker works.
  #   smmu=4: identity stage 1 with non-cacheable blocks -> stalls the same way.
  #   16 (erhai): read-only UIC DME_GET dump of the link state.
  #     -> FAST HS-G5 x2, T_CONNECTIONSTATE 0, peer gets fail (0xa): the device does not answer.
  #   17 (erhai): DME_HIBERNATE_EXIT first, then the same reads.
  #     -> Hibern8 exit completes, the peer answers and the CPort is connected: the
  #        firmware leaves the link in Hibern8. uicWakeLink now does this before NOP OUT.
  #   probe 10 (2026-10-23, after the wake): GPT read, userdata 0x3798e8..0x3adb7fa.
  # The UFS root itself (no probe level): NativeUfs publishes the verified OS and
  # SystemOS windows of userdata. sheng-pmgr=2 publishes the original PMGR nub
  # AMFI requires (payload.py refuses native-ufs-root=1 without it), and
  # offline-apfs-load loads the prelinked APFS before the root is looked up.
  "native-ufs-root=1",
  "sheng-pmgr=2",
  "offline-apfs-load=1",
  "native-ufs-smmu=2",
  # Print the transport/SMMU snapshot when a probe or the root path fails.
  "native-ufs-diagnostics=1",
]

[payload.adt]
tool = "scripts/make-erhai-adt.py"
# 4 GiB, the RAM of the iPad7,1 this kernelcache is qualified for (sheng uses
# 4.75 GiB). DarwinBoot's AllocateWindow takes ONE EfiConventionalMemory run of
# at least this size and prints "NO WINDOW <requested> BIG RUN <biggest> @ <start>"
# on the panel when none exists. Below 4 GiB erhai has nothing bigger than
# ~400 MiB, so erhaiPkg's MemoryMapLib gives UEFI "DRAM_High", 0x8C0000000 +
# 5 GiB of the 9 GiB run the ABL's /memory node lists on this unit (no fixed
# reserved-memory node above 4 GiB). The window lands there; the remaining
# ~1 GiB covers UEFI's own top-down allocations in that bank.
# The first boots used 0x10000000 (256 MiB): enough to reach the root-device
# wait, far too little for userspace.
owned_memory_size = "0x100000000"
# The real SM8750 MPIDRs, read off this unit and identical to sheng's SM8550
# layout: six cores in cluster 0, two in cluster 1 at 0x10000/0x10100.
#
# One core only, matching kernel_args cpus=1. Publishing one core makes ArmCpu
# build a single-CPU topology, which is what the early bring-up path is audited
# for: the secondary-core entry, per-core stacks and GIC redistributor bring-up
# have not been exercised on this board. Publishing eight cores while the kernel
# is told cpus=1 leaves seven CPUs in the ADT that nothing ever brings online,
# and any Apple kext that waits on secondaries times out on them.
cpu_regs = "0"
# The APFS volume UUID of the IPSW's OS image (044-76040-038.dmg), published by NativeUfs from the
# userdata OS window. Without it the root matcher falls back to IOMedia Content=Apple_HFS, which the
# APFS volume never satisfies (hardware 2026-10-23: root device wait timeout, NativeUfs silent).
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
packed_data_ramdisk = true
ipad_identity = true
trust_cache = true
# unique-chip-id + chip-id produce IOPlatformUUID. A process that calls
# gethostuuid() with a zero timeout blocks forever when the seed is missing —
# one of the known "kernel runs, nothing appears" failure modes.
#
# The seed is this unit's Qualcomm chip serial, read off the device:
#   adb shell getprop ro.boot.chipecid  ->  0000045a697358b6
# It is per-unit, so it does not belong in a repository. payload.py only reads
# the CLI/env seed when this key is literally "required"; any other value here
# would silently shadow the secret. The workflow supplies the secret as
# UNIXNU_UNIQUE_CHIP_ID.
unique_chip_id = "required"
# 207 is what sheng writes here, and sheng is the only port that has reached an
# iPadOS home screen. This is the ADT chip-id property, NOT the Apple chip ID:
# 0x8011 belongs in [ipsw] chip_id, where it selects the IPSW components.
# Mixing the two makes MobileGestalt read the wrong platform.
#
# Note the generator parses this with int(value, 16), so "207" becomes 0x207.
# That mismatch exists in sheng too and its board boots, so it is copied rather
# than "fixed": matching the working board beats matching the comment.
chip_id = "207"

[bootimg]
# The OnePlus ABL loads init_boot's ramdisk even during fastboot boot, so the
# payload has to ride inside the kernel field instead of the ramdisk field.
embed_payload = true

[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xfc800000", "0x0", "0x2b00000"] },
]

[firmware]
config = "erhai"
dsc = "Platforms/OnePlus/erhaiPkg/erhai.dsc"
fd = "Build/erhaiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "erhai"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "erhai-ipad71-bringup-20261022"
